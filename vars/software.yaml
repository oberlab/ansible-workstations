software:
  groups:
    base:
      apt_packages:
        - curl
        - firefox
        - firefox-locale-de
        - git
        - htop
        - pip
        - pv
        - screen
        - vim
        - code
      apt_repository_keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      apt_repositories:
        - deb [arch=amd64] https://packages.microsoft.com/repos/vscode stable main
      flatpaks:
        - name: org.localsend.localsend_app
      pinned_apps:
        - nemo.desktop
        - firefox.desktop
        - org.localsend.localsend_app.desktop:flatpak

    2d-graphics:
      apt_packages:
        - inkscape
        - gimp
      pinned_apps:
        - org.inkscape.Inkscape.desktop

    arduino:
      flatpaks:
        - name: cc.arduino.IDE2
      pinned_apps:
        - cc.arduino.IDE2.desktop:flatpak

    3d-printing:
      #apt_packages:
      #  - prusa-slicer
      flatpaks:
        - name: org.openscad.OpenSCAD
          remote: flathub-beta
        - name: com.orcaslicer.OrcaSlicer
        - name: com.prusa3d.PrusaSlicer
        - name: org.freecad.FreeCAD
      pinned_apps:
        #- PrusaSlicer.desktop
        - com.prusa3d.PrusaSlicer.desktop:flatpak
        - org.freecad.FreeCAD.desktop:flatpak
        - org.openscad.OpenSCAD.desktop:flatpak
        - com.orcaslicer.OrcaSlicer.desktop:flatpak
